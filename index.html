<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revshopp - Toko Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .product-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            transition: transform 0.3s;
        }
        
        .product-image {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .product-price {
            color: #e74c3c;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .btn {
            background-color: #27ae60;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        
        .btn:hover {
            background-color: #229954;
        }
        
        .btn:active {
            background-color: #1e8449;
        }
        
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ Revshopp - Toko Online</h1>
        <p>Produk Berkualitas Terpercaya</p>
    </header>
    
    <div class="container">
        <div class="products">
            <!-- Produk 1 -->
            <div class="product-card">
                <div class="product-image">👟</div>
                <div class="product-name">Sepatu Olahraga</div>
                <div class="product-price">Rp 299.000</div>
                <button class="btn" type="button">Beli Sekarang</button>
            </div>
            
            <!-- Produk 2 -->
            <div class="product-card">
                <div class="product-image">👕</div>
                <div class="product-name">Kaos Polos Premium</div>
                <div class="product-price">Rp 89.000</div>
                <button class="btn" type="button">Beli Sekarang</button>
            </div>
            
            <!-- Produk 3 -->
            <div class="product-card">
                <div class="product-image">⌚</div>
                <div class="product-name">Jam Tangan Digital</div>
                <div class="product-price">Rp 199.000</div>
                <button class="btn" type="button">Beli Sekarang</button>
            </div>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2025 Revshopp - Semua Hak Dilindungi</p>
    </footer>

    <script>
        // Ambil semua tombol
        var buttons = document.querySelectorAll('.btn');
        
        // Tambahkan event listener ke setiap tombol
        buttons.forEach(function(button) {
            button.addEventListener('click', function() {
                var card = this.parentElement;
                var namaProduk = card.querySelector('.product-name').textContent;
                var hargaProduk = card.querySelector('.product-price').textContent;
                
                alert('Produk: ' + namaProduk + '\n' + hargaProduk + '\n\nProduk ditambahkan ke keranjang!');
            });
        });
    </script>
</body>
</html>
